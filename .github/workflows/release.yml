name: Publish Cross-Platform

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_REDIRECT_URL: ${{ secrets.VITE_REDIRECT_URL }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  TAURI_BUNDLE: all

permissions:
  contents: read

jobs:
  sync-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      section: ${{ steps.notes.outputs.section }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0

      - name: Validate pushed tag matches project version
        id: target
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"
          git rev-parse --verify "refs/tags/$TAG" >/dev/null || { echo "::error::Release tag $TAG does not exist"; exit 1; }
          PACKAGE_VERSION=$(git show "$TAG:package.json" | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")
          CARGO_VERSION=$(git show "$TAG:Cargo.toml" | sed -n '/^\[workspace.package\]/,/^\[/p' | sed -n 's/^version *= *"\([^"]*\)".*/\1/p')
          [[ "$TAG" == "v$PACKAGE_VERSION" && "$PACKAGE_VERSION" == "$CARGO_VERSION" ]] || { echo "::error::Tag $TAG != package.json $PACKAGE_VERSION or Cargo.toml $CARGO_VERSION"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Created here so the build jobs can upload in parallel instead of
      # waiting for tauri-action to create it.
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes ""

      - name: Ensure CHANGELOG.md has an entry for this tag
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          GITHUB_REF_NAME="$RELEASE_TAG"
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk -v ver="[$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md)

          if [[ -z "${SECTION}" ]]; then
            echo "No CHANGELOG.md entry for ${VERSION} yet; auto-generating one from commit history."
            PREV_TAG=$(git tag --sort=-v:refname | grep -vF "${GITHUB_REF_NAME}" | head -1 || true)
            DATE=$(date +%Y-%m-%d)
            RANGE="${PREV_TAG:+${PREV_TAG}..}${GITHUB_REF_NAME}"
            ENTRY=$(mktemp)
            {
              echo "## [${VERSION}] - ${DATE}"
              echo
              git log "${RANGE}" --pretty=format:"- %s (\`%h\`)" --no-merges
              echo
              echo
            } > "${ENTRY}"

            FIRST_SECTION_LINE=$(grep -n '^## \[' CHANGELOG.md | head -1 | cut -d: -f1)
            {
              head -n $((FIRST_SECTION_LINE - 1)) CHANGELOG.md
              cat "${ENTRY}"
              tail -n "+${FIRST_SECTION_LINE}" CHANGELOG.md
            } > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
            rm -f "${ENTRY}"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore: auto-generate changelog entry for ${VERSION}"
            git push origin HEAD:master

            SECTION=$(awk -v ver="[$VERSION]" '
              /^## \[/ { if (found) exit; if (index($0, ver)) { found=1; next } }
              found { print }
            ' CHANGELOG.md)
          fi

          {
            echo 'section<<EOF'
            echo "${SECTION}"
            printf '\nEOF\n'
          } >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: sync-changelog
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: ""
          - platform: "macos-latest"
            args: '--target x86_64-apple-darwin'
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: "--bundles deb"
          - platform: "windows-latest"
            args: ""
          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.sync-changelog.outputs.tag }}

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc' || '' }}

      - name: Import Apple Developer Certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
      - name: Verify Certificate
        if: runner.os == 'macOS'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> "$GITHUB_ENV"
          echo "Certificate imported."

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libasound2-dev

      - name: install frontend dependencies
        run: bun install

      # keke ships as a Tauri sidecar, downloaded from the pinned keke release.
      - name: Fetch keke sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          TRIPLE=$(echo "$MATRIX_ARGS" | sed -n 's/.*--target[= ]\([^ ]*\).*/\1/p')
          if [[ -z "$TRIPLE" ]]; then
            TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          fi
          EXT=""
          if [[ "$TRIPLE" == *windows* ]]; then EXT=".exe"; fi
          bash scripts/fetch-keke.sh "$TRIPLE" "src-tauri/binaries/keke-${TRIPLE}${EXT}"

      - name: Read Release Notes
        id: notes
        shell: bash
        env:
          SECTION: ${{ needs.sync-changelog.outputs.section }}
        run: |
          {
            echo 'body<<EOF'
            echo "$SECTION"
            printf '\nEOF\n'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          # Repo variable; empty or unset builds without telemetry.
          CODEXIA_TELEMETRY_URL: ${{ vars.CODEXIA_TELEMETRY_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
        with:
          tagName: ${{ needs.sync-changelog.outputs.tag }}
          releaseName: ${{ needs.sync-changelog.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.keke.conf.json

      # Reuses the exe tauri-action just built instead of a second full build.
      - name: Upload Windows portable archive
        if: matrix.platform == 'windows-latest' && matrix.args == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.sync-changelog.outputs.tag }}
        run: |
          $name = "codexia_$($env:RELEASE_TAG -replace '^v', '')_x64_portable"
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          Copy-Item target/release/codexia.exe dist-portable/
          # Sidecar sits next to the app exe, where the ACP resolver looks for it.
          Copy-Item src-tauri/binaries/keke-x86_64-pc-windows-msvc.exe dist-portable/keke.exe
          Compress-Archive -Path dist-portable/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash" | Out-File -Encoding ascii -NoNewline "$name.zip.sha256"
          gh release upload $env:RELEASE_TAG "$name.zip" "$name.zip.sha256" --clobber

      - name: Clean up keychain
        if: runner.os == 'macOS'
        run: |
          security delete-keychain build.keychain
          rm -f certificate.p12

  web-packages:
    needs: sync-changelog
    permissions:
      contents: write
    uses: ./.github/workflows/release-web.yml
    with:
      tag: ${{ needs.sync-changelog.outputs.tag }}
    secrets: inherit

  publish-release:
    needs: [sync-changelog, publish-tauri, web-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.sync-changelog.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
